name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore QuizProject.slnx

      # Аналайзеры включены, warnings = errors (Directory.Build.props) — это и есть линтер/стат. анализ.
      - name: Build
        run: dotnet build QuizProject.slnx --no-restore -c Release

      - name: Format check
        run: dotnet format QuizProject.slnx --verify-no-changes --no-restore

      - name: Unit tests
        run: dotnet test QuizProject.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service: [Api, Worker, Realtime]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # push в registry и деплой в minikube — CD-часть, добавим в спринте 3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Quiz.${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
