# Локальный запуск всего приложения: cp .env.example .env && docker compose up --build
# Открыть: http://localhost:8080 (фронт), http://localhost:8080/docs (API), http://localhost:15672 (RabbitMQ UI)

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Production
  Mongo__ConnectionString: mongodb://mongo:27017
  Mongo__Database: quiz
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
  Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}

x-service-health: &service-health
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80 && printf \"GET /health/live HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 15s

x-depends: &depends
  mongo:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017" # 27018 снаружи — чтобы не конфликтовать с локальным mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    build: deploy/rabbitmq
    image: quiz/rabbitmq:dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP — для запуска сервисов из IDE
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  api:
    build:
      context: .
      dockerfile: src/Quiz.Api/Dockerfile
    image: quiz/api:dev
    environment: *service-env
    depends_on: *depends
    healthcheck: *service-health
    restart: on-failure

  worker:
    build:
      context: .
      dockerfile: src/Quiz.Worker/Dockerfile
    image: quiz/worker:dev
    environment: *service-env
    depends_on: *depends
    healthcheck: *service-health
    restart: on-failure

  realtime:
    build:
      context: .
      dockerfile: src/Quiz.Realtime/Dockerfile
    image: quiz/realtime:dev
    environment: *service-env
    depends_on: *depends
    healthcheck: *service-health
    restart: on-failure

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api
      - realtime

volumes:
  mongo-data:
  rabbitmq-data:
