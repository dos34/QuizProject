# Единая точка входа: статика фронта, /api → WebAPI, /hubs → SignalR.
# Фронт и хаб на одном origin — CORS не нужен.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs { proxy_pass http://api:80; }
  location /docs/ { proxy_pass http://api:80; }
  location /openapi/ { proxy_pass http://api:80; }

  location /hubs/ {
    proxy_pass http://realtime:80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
